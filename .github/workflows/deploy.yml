name: Deploy to Firebase Hosting & Firestore

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/main/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix apps/main ci

      - name: Build & Assemble Sites
        run: |
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HANHAGA_2027 }}'
          channelId: live
          projectId: hanhaga-2027

      - name: Deploy Firestore Rules
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HANHAGA_2027 }}'
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/gcp-key.json"
            npx firebase-tools deploy --only firestore:rules --project hanhaga-2027
            rm -f gcp-key.json
          fi
